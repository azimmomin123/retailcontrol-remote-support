# Inactive template. Export only the audited native-source subset to a public
# repository before placing this at .github/workflows/windows-native.yml.
# Do not copy this workflow into the private RetailControl application repo.
name: Build credential-free RetailControl Windows client

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the unsigned generic client and source as a public prerelease
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: native-windows-build
  cancel-in-progress: false

jobs:
  windows-x64:
    # Evaluated before a runner is assigned. Private-repository minutes are not
    # permitted: only standard public-repository hosted runners are free.
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.private == false }}
    runs-on: windows-2022
    timeout-minutes: 180
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      VCPKG_BINARY_SOURCES: clear
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
    steps:
      - name: Check out public customization source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: customization
          persist-credentials: false

      - name: Require the public verification key
        run: |
          $key = Join-Path $env:GITHUB_WORKSPACE 'customization/profile-public-key.bin'
          if (-not (Test-Path -LiteralPath $key -PathType Leaf)) {
            throw 'The public customization repository must contain its 32-byte verification key.'
          }
          if ((Get-Item -LiteralPath $key).Length -ne 32) { throw 'Invalid public verification key.' }

      - name: Check out exact RustDesk source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: rustdesk/rustdesk
          ref: 6c578292e8ebbbec708b76986ba8c4bc7c509747
          path: upstream
          submodules: recursive
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: '15.0.6'

      - name: Install Flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: stable
          flutter-version: '3.24.5'
          architecture: x64
          cache: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: '1.93.0'
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Compile and test the public base client and Windows installation
        run: |
          & "$env:GITHUB_WORKSPACE/customization/windows-build.ps1" `
            -SourceDir "$env:GITHUB_WORKSPACE/upstream" `
            -NativeDir "$env:GITHUB_WORKSPACE/customization" `
            -PublicKeyFile "$env:GITHUB_WORKSPACE/customization/profile-public-key.bin" `
            -OutputDir "$env:GITHUB_WORKSPACE/release"
          & "$env:GITHUB_WORKSPACE/customization/windows-smoke.ps1" `
            -SourceDir "$env:GITHUB_WORKSPACE/upstream" `
            -NativeDir "$env:GITHUB_WORKSPACE/customization" `
            -OutputDir "$env:GITHUB_WORKSPACE/release"
          $report = Join-Path $env:GITHUB_WORKSPACE 'release/windows-smoke.json'
          if (-not (Test-Path -LiteralPath $report -PathType Leaf)) { throw 'Windows installation test report is missing.' }
          $hash = (Get-FileHash -LiteralPath $report -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  windows-smoke.json" | Add-Content -LiteralPath "$env:GITHUB_WORKSPACE/release/SHA256SUMS" -Encoding utf8

      - name: Publish generic release files
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "native-$env:GITHUB_RUN_NUMBER-$env:GITHUB_RUN_ATTEMPT"
          $directory = Join-Path $env:GITHUB_WORKSPACE 'release'
          $names = @('RetailControlRemoteSupport-base.exe', 'build-receipt.json', 'windows-smoke.json', 'SHA256SUMS', 'RustDesk-Source.tar.gz', 'LICENSE.txt', 'SOURCE.txt')
          $files = @($names | ForEach-Object {
            $path = Join-Path $directory $_
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing release file: $_" }
            $path
          })
          $notes = Join-Path $env:RUNNER_TEMP 'native-release-notes.txt'
          @'
          Credential-free RetailControl Remote Support base client, compiled from the pinned RustDesk source.

          Unsigned. Windows profile tests and an isolated installation/service test using a separately compiled synthetic profile key passed. See windows-smoke.json for exactly what was checked. Interactive UAC, real store enrollment, unattended access, and reboot acceptance have not been tested. The client requires a separately signed private enrollment profile before store deployment.

          The accompanying build receipt records source and tool versions. The full modified source and license are included both in the client payload and as release downloads.
          '@ | Set-Content -LiteralPath $notes -Encoding utf8
          & gh release create $tag @files --repo $env:RELEASE_REPOSITORY --target $env:RELEASE_COMMIT --title "Windows native candidate $tag" --notes-file $notes --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }

      - name: Report verification boundary
        run: |
          'Native compilation, Windows profile tests, and an isolated synthetic installation/service check completed. No interactive UAC, real store enrollment, unattended session, or reboot was performed.' >> $env:GITHUB_STEP_SUMMARY
          'No production profile, preset password, or private signing key is supplied to this workflow. Its temporary synthetic test keys remain on the disposable runner. No Actions artifact upload or shared dependency cache is used.' >> $env:GITHUB_STEP_SUMMARY
